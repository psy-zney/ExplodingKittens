# Included inside a server{} listening on port 9000.
# /kittens is safe to add next to an existing application at /.
location = /kittens {
    return 308 /kittens/;
}

location = /kittens/health {
    proxy_pass http://127.0.0.1:3105/health;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
}

location ^~ /kittens/socket.io/ {
    proxy_pass http://127.0.0.1:3105/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $kittens_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
    client_max_body_size 64k;
}

location ^~ /kittens/assets/ {
    alias /var/www/exxplore-kittens/assets/;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /kittens/ {
    alias /var/www/exxplore-kittens/;
    index index.html;
    try_files $uri $uri/ /kittens/index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}
