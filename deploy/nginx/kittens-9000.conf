server {
    listen 9000;
    listen [::]:9000;
    server_name localhost 127.0.0.1 149.118.50.176 149-118-50-176.sslip.io;

    access_log /var/log/nginx/exxplore-kittens.access.log;
    error_log /var/log/nginx/exxplore-kittens.error.log;

    location = / {
        return 302 /kittens/;
    }
    location = /health {
        proxy_pass http://127.0.0.1:3105/health;
        add_header Cache-Control "no-store" always;
    }
    include /etc/nginx/snippets/kittens-locations.conf;
    location / {
        return 404;
    }
}
